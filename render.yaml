echo "services:
  - type: web
    name: tstorage
    env: node
    rootDir: .
    buildCommand: npm run install-all && npm run build-frontend
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        fromDatabase:
          name: tstorage-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://tstorage.onrender.com" > render.yaml